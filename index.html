<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#101824">
    <title>Crystal Match</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="topbar" aria-label="Stav hry">
        <div class="title-block">
          <p class="eyebrow">Crystal Match</p>
        </div>
        <div class="top-actions">
          <button id="newGame" class="new-game hidden" type="button">Nova hra</button>
        </div>
      </section>

      <section class="play-area">
        <aside class="stats" aria-label="Herni statistiky">
          <div class="stat">
            <span>Level</span>
            <strong id="level">1</strong>
          </div>
          <div class="stat urgent-stat">
            <span>Cas</span>
            <strong id="time">60</strong>
          </div>
          <div class="stat">
            <span>Body</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span>Cil</span>
            <strong id="target">2500</strong>
          </div>
        </aside>
        <div class="board-wrap">
          <div id="board" class="board" aria-label="Match 3 herni pole"></div>
          <div id="message" class="message" role="status" aria-live="polite"></div>
        </div>

        <aside class="panel">
          <div class="meter" aria-label="Postup ke splneni cile">
            <div id="progress" class="meter-fill"></div>
          </div>
          <div class="sound-panel" aria-label="Zvukove ovladani">
            <button id="toggleMusic" class="sound-toggle" type="button">MUSIC ON</button>
            <button id="toggleSound" class="sound-toggle" type="button">SOUND ON</button>
          </div>
        </aside>
      </section>
    </main>

    <div id="fireworks" class="fireworks" aria-hidden="true"></div>
    <div id="instructionModal" class="modal show" role="dialog" aria-modal="true" aria-labelledby="instructionTitle">
      <div class="modal-card">
        <h2 id="instructionTitle">Jak hrat</h2>
        <p>Nasbirej cilove body driv, nez vyprsi cas. Kameny muzes tukat, tahnout prstem nebo kliknout na doporuceny tah. Dalsi level ma kratsi limit a vyssi cil.</p>
        <button id="instructionOk" class="primary-action" type="button">OK</button>
      </div>
    </div>
    <div id="adModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="adTitle">
      <div class="modal-card">
        <h2 id="adTitle">Cas vyprsel</h2>
        <p>Muzes se podivat na kratkou reklamu a pokracovat jeste 30 sekund.</p>
        <div class="modal-actions">
          <button id="watchAd" class="primary-action" type="button">Reklama +30 s</button>
          <button id="skipAd" class="secondary-action" type="button">Konec hry</button>
        </div>
      </div>
    </div>

    <audio id="background-music" src="music/track1.mp3" loop preload="auto"></audio>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="vendor/fireworks.js"></script>
    <script src="game.js"></script>
  </body>
</html>
